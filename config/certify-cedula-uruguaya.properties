## ------------------------------------------- DNIC / Cedula Uruguaya usecase properties ------------------------------------------------------------
mosip.certify.integration.scan-base-package=io.mosip.certify.mock.integration
mosip.certify.integration.audit-plugin=LoggerAuditService

mosip.certify.plugin-mode=DataProvider
mosip.certify.integration.data-provider-plugin=PostgresDataProviderPlugin
mosip.certify.data-provider-plugin.id-field-prefix-uri=https://mosip.io/credential/
mosip.certify.database.name=inji_certify
mosip.certify.status-list.signature-crypto-suite=Ed25519Signature2020

# did.json must be hosted at https://emmanuelacostaiugo.github.io/DID/hackathon/did.json (gh-pages branch, /hackathon folder)
mosip.certify.data-provider-plugin.did-url=did:web:emmanuelacostaiugo.github.io:DID:hackathon
mosip.certify.issuer.uri=did:web:emmanuelacostaiugo.github.io:DID:hackathon
mosip.certify.issuer.pub.key=did:web:emmanuelacostaiugo.github.io:DID:hackathon#key-0
mosip.certify.issuer.vc-sign-algo=Ed25519Signature2020

mosip.certify.credential-config.issuer.display={\
  {\
    'name': 'DNIC Issuer',\
    'locale': 'en'\
  }\
}

# scope must match "scope" in the CedulaUruguayaCredential row added via POST /credential-configurations
# (see cedula-uruguaya-credential-config.json in this same folder - body ready to send)
# The map KEY must equal EXACTLY the JWT "scope" claim value (PostgresDataProviderPlugin.fetchData does
# scopeQueryMapping.get(identityDetails.get("scope")) - a plain "dni", not "certify-credential-audience dni").
# A wrong/missing key silently resolves to a null queryString, which crashes Hibernate with a confusing
# NPE ("key is null" in QueryInterpretationCacheStandardImpl.resolveNativeQueryParameters) instead of a
# clear "no query configured" error.
# NOTE: for the Pre-Authorized Code flow, Certify always JSON-serializes the whole "claims" map into the
# token's "sub" (see PreAuthorizedCodeService.generateAccessToken), so :id below is a JSON string like
# '{"ci":"uy-ci-51234567",...}', not a plain CI. Embedding CAST/->> with quoted literals directly in
# this query text crashes the same Hibernate native-query parameter parser. Instead, the JSON parsing is
# isolated in a plain SQL function (see certify.extract_ci_from_claims in certify_init.sql / created
# directly in DB) so this query text stays as simple as the original "col = :id" pattern.
mosip.certify.data-provider-plugin.postgres.scope-query-mapping={\
  'dni': 'select * from certify.cedula_uruguaya where ci = certify.extract_ci_from_claims(:id)'\
}

## Auth server for this usecase is Keycloak (realm inji-poc), overriding the default esignet-mock used by other usecases.
## The Keycloak client "inji-cert" must map its "sub" claim to the CI (document number) so it matches :id above.
## Host must match the token's "iss" claim exactly (verified from a real token: https://keycloak.iugolabs.com/realms/inji-poc), not the bare IP.
mosip.certify.authorization.url=https://keycloak.iugolabs.com/realms/inji-poc

## NOTE: mosip.certify.authn.issuer-uri/jwk-set-uri control how Certify validates the Bearer token on
## POST /issuance/credential (resource-server side). These only accept ONE issuer at a time, so the
## authorization_code flow (Keycloak-issued tokens) and the Pre-Authorized Code flow (Certify-issued
## tokens, self-signed via mosip.certify.oauth.*) are mutually exclusive here. We're using
## Pre-Authorized Code, so these must point at Certify itself, not Keycloak - otherwise every
## /issuance/credential call gets rejected with an empty 401 (JWT signature won't match Keycloak's JWKS).
mosip.certify.authn.issuer-uri=${mosip.certify.domain.url}
mosip.certify.authn.jwk-set-uri=${mosip.certify.domain.url}${server.servlet.path}/.well-known/jwks.json

## The Pre-Authorized Code flow uses Certify's OWN built-in OAuth token endpoint (not Keycloak).
## certify-default.properties derives these from mosip.certify.authorization.url, which we just
## overrode to Keycloak above - re-point them back to Certify's own domain for this flow.
mosip.certify.oauth.issuer=${mosip.certify.domain.url}
mosip.certify.oauth.token-endpoint=${mosip.certify.domain.url}${server.servlet.path}/oauth/token
mosip.certify.oauth.jwks-uri=${mosip.certify.domain.url}${server.servlet.path}/.well-known/jwks.json
mosip.certify.oauth.interactive-authorization-endpoint=${mosip.certify.domain.url}${server.servlet.path}/oauth/iar
## The wallet reads "authorization_servers" from /.well-known/openid-credential-issuer and only checks
## the FIRST entry. Without this mapping it falls back to mosip.certify.authorization.url (Keycloak),
## whose oauth-authorization-server metadata does NOT list pre-authorized_code as a supported grant type,
## so the wallet rejects the pre-authorized flow client-side before ever calling Certify's /oauth/token.
mosip.certify.credential-config.as-mapping={"CedulaUruguayaCredential":"${mosip.certify.domain.url}"}
# "https://certify.dev.inji-reniec.com/..." is the real public Certify domain seen in the token's "aud" claim
mosip.certify.authn.allowed-audiences={ '${mosip.certify.domain.url}${server.servlet.path}/issuance/credential', 'https://certify.dev.inji-reniec.com/v1/certify/issuance/credential', 'https://certify.dev.inji-reniec.com', 'inji-cert' }
